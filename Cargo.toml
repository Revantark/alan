[workspace]
resolver = "3"
members = ["crates/tools", "crates/llm", "crates/providers", "crates/agent", "crates/alan"]

[workspace.dependencies]
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
llm = { path = "crates/llm" }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
