[package]
name = "alan"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "A minimal coding agent written in Rust"
license = "MIT"
homepage = "https://github.com/Revantark/alan"
repository = "https://github.com/Revantark/alan"
documentation = "https://docs.rs/alan"
readme = "../../README.md"
exclude = ["Cargo.lock"]

[dependencies]
agent = { path = "../agent" }
llm = { path = "../llm" }
providers = { path = "../providers" }
tools = { path = "../tools" }
alan-tui = { path = "../tui" }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
crossterm = { version = "0.29", features = ["event-stream"] }
tui-textarea-2 = "0.13"
anyhow = "1"
tokio = { workspace = true }
futures-util = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
strum = { workspace = true }
async-trait = { workspace = true }
unicode-width = "0.2"
arboard = "=3.4.1"
base64 = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }
tui-markdown = "0.3.9"
tracing-subscriber = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
ignore = { workspace = true }
fs2 = "0.4"

[dev-dependencies]
llm = { workspace = true }
async-trait = { workspace = true }

[[bin]]
name = "alan"
path = "src/main.rs"
