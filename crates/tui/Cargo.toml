[package]
name = "alan-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A small Ratatui runtime with explicit, typed communication."
license = "MIT"
homepage = "https://github.com/Revantark/alan"
repository = "https://github.com/Revantark/alan"
documentation = "https://docs.rs/tui"
readme = "README.md"
exclude = ["Cargo.lock"]

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { workspace = true }
tokio = { version = "1.53", features = ["sync", "time", "rt", "macros"] }
unicode-width = "0.2"

[dev-dependencies]
tui-textarea-2 = "0.13"
reqwest = { workspace = true }
serde = { workspace = true }